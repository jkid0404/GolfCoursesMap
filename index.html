<!DOCTYPE html>
<html lang="en">
<head>
    <title>Golf Courses of the USA</title>

    <meta charset="utf-8" />
	<link rel="shortcut icon" href="/favicon.ico"/>
    
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="This map shows golf courses in the USA, grouped by accessiblity and whether they have been played." />
    <meta name="keywords" content="golf, map, golf course, course, links" />
    <meta name="author" content="Jason W" /><meta name="version" content="1.0" />

    <!-- Add references to the Azure Maps Map control JavaScript and CSS files. -->
    <link href="https://atlas.microsoft.com/sdk/javascript/mapcontrol/3/atlas.min.css" rel="stylesheet" />
    <script src="https://atlas.microsoft.com/sdk/javascript/mapcontrol/3/atlas.min.js"></script>

    <!-- Add a reference to the Azure Maps Services Module JavaScript file. -->
    <script src="https://atlas.microsoft.com/sdk/javascript/service/2/atlas-service.min.js"></script>

    <!-- Add references to the store locator JavaScript and CSS files. -->
    <link rel="stylesheet" href="index.css" type="text/css" />
    <script src="index.js"></script>
</head>
<body>
    <header>
        <img src="images/Logo.png" />
        <span>Golf Courses of the USA</span>
    </header>
    <main>
        <div class="searchPanel">
            <div>
                <input id="searchTbx" type="search" placeholder="Find a course" />
                <button id="searchBtn" title="Search"></button>
            </div>
        </div>

        <div id="listPanel"></div>

        <div id="myMap"></div>

        <button id="myLocationBtn" title="My Location"></button>
    </main>
</body>
</html>
